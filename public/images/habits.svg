<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f9fafb" />
      <stop offset="100%" stop-color="#f3f4f6" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="300" fill="url(#bg-gradient)" />
  
  <!-- Header -->
  <rect x="0" y="0" width="600" height="50" fill="white" />
  <text x="20" y="30" font-family="Arial" font-size="18" font-weight="bold" fill="#111827">Habits</text>
  
  <!-- Stats -->
  <rect x="20" y="70" width="180" height="60" rx="8" fill="white" stroke="#e5e7eb" stroke-width="1" />
  <circle cx="45" cy="100" r="15" fill="#ECFDF5" />
  <text x="42" y="105" font-family="Arial" font-size="14" font-weight="bold" fill="#10B981">🔥</text>
  <text x="70" y="90" font-family="Arial" font-size="12" fill="#6b7280">Current Streak</text>
  <text x="70" y="110" font-family="Arial" font-size="18" font-weight="bold" fill="#111827">7 days</text>
  
  <rect x="210" y="70" width="180" height="60" rx="8" fill="white" stroke="#e5e7eb" stroke-width="1" />
  <circle cx="235" cy="100" r="15" fill="#EBF5FF" />
  <text x="232" y="105" font-family="Arial" font-size="14" font-weight="bold" fill="#3B82F6">🏆</text>
  <text x="260" y="90" font-family="Arial" font-size="12" fill="#6b7280">Longest Streak</text>
  <text x="260" y="110" font-family="Arial" font-size="18" font-weight="bold" fill="#111827">21 days</text>
  
  <rect x="400" y="70" width="180" height="60" rx="8" fill="white" stroke="#e5e7eb" stroke-width="1" />
  <circle cx="425" cy="100" r="15" fill="#F5F3FF" />
  <text x="422" y="105" font-family="Arial" font-size="14" font-weight="bold" fill="#8B5CF6">🔄</text>
  <text x="450" y="90" font-family="Arial" font-size="12" fill="#6b7280">Active Habits</text>
  <text x="450" y="110" font-family="Arial" font-size="18" font-weight="bold" fill="#111827">3</text>
  
  <!-- Habit Card 1 -->
  <rect x="20" y="150" width="560" height="70" rx="8" fill="white" stroke="#e5e7eb" stroke-width="1" />
  <rect x="20" y="150" width="4" height="70" fill="#10B981" rx="2" />
  <text x="40" y="175" font-family="Arial" font-size="16" font-weight="bold" fill="#111827">Morning meditation</text>
  <rect x="300" y="165" width="70" height="20" rx="10" fill="#ECFDF5" />
  <text x="310" y="179" font-family="Arial" font-size="10" fill="#10B981">mindfulness</text>
  <rect x="380" y="165" width="50" height="20" rx="10" fill="#f3f4f6" />
  <text x="390" y="179" font-family="Arial" font-size="10" fill="#6b7280">daily</text>
  <text x="40" y="195" font-family="Arial" font-size="12" fill="#6b7280">10 minutes of mindfulness meditation each morning</text>
  <rect x="500" y="165" width="60" height="30" rx="15" fill="#10B981" />
  <text x="515" y="185" font-family="Arial" font-size="12" fill="white">✓ Done</text>
  
  <!-- Habit Card 2 -->
  <rect x="20" y="230" width="560" height="70" rx="8" fill="white" stroke="#e5e7eb" stroke-width="1" />
  <rect x="20" y="230" width="4" height="70" fill="#3B82F6" rx="2" />
  <text x="40" y="255" font-family="Arial" font-size="16" font-weight="bold" fill="#111827">Exercise</text>
  <rect x="300" y="245" width="50" height="20" rx="10" fill="#EBF5FF" />
  <text x="310" y="259" font-family="Arial" font-size="10" fill="#3B82F6">health</text>
  <rect x="360" y="245" width="50" height="20" rx="10" fill="#f3f4f6" />
  <text x="370" y="259" font-family="Arial" font-size="10" fill="#6b7280">daily</text>
  <text x="40" y="275" font-family="Arial" font-size="12" fill="#6b7280">30 minutes of physical activity</text>
  <rect x="500" y="245" width="60" height="30" rx="15" fill="white" stroke="#3B82F6" stroke-width="1" />
  <text x="510" y="265" font-family="Arial" font-size="12" fill="#3B82F6">Mark</text>
</svg>