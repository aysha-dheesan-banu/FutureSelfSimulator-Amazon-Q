<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f9fafb" />
      <stop offset="100%" stop-color="#f3f4f6" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="300" fill="url(#bg-gradient)" />
  
  <!-- Header -->
  <rect x="0" y="0" width="600" height="50" fill="white" />
  <text x="20" y="30" font-family="Arial" font-size="18" font-weight="bold" fill="#111827">Journal</text>
  
  <!-- Sentiment Analysis -->
  <rect x="20" y="70" width="560" height="60" rx="8" fill="white" stroke="#e5e7eb" stroke-width="1" />
  <text x="40" y="90" font-family="Arial" font-size="12" font-weight="bold" fill="#6b7280">Sentiment Analysis</text>
  <rect x="40" y="100" width="400" height="10" rx="5" fill="#f3f4f6" />
  <rect x="40" y="100" width="200" height="10" rx="5" fill="#10B981" />
  <rect x="240" y="100" width="100" height="10" rx="5" fill="#F59E0B" />
  <rect x="340" y="100" width="50" height="10" rx="5" fill="#EF4444" />
  <text x="40" y="125" font-family="Arial" font-size="10" fill="#6b7280">Positive (8)</text>
  <text x="240" y="125" font-family="Arial" font-size="10" fill="#6b7280">Neutral (3)</text>
  <text x="340" y="125" font-family="Arial" font-size="10" fill="#6b7280">Negative (1)</text>
  
  <!-- Journal Entry -->
  <rect x="20" y="150" width="560" height="130" rx="8" fill="white" stroke="#e5e7eb" stroke-width="1" />
  <text x="40" y="175" font-family="Arial" font-size="16" font-weight="bold" fill="#111827">Productive day at work</text>
  <text x="450" y="175" font-family="Arial" font-size="12" fill="#6b7280">October 15, 2023</text>
  <text x="40" y="200" font-family="Arial" font-size="12" fill="#6b7280" width="500">Today was incredibly productive. I managed to complete the project ahead of schedule and received positive feedback from my manager. I'm feeling motivated to tackle more challenges tomorrow.</text>
  
  <line x1="40" y1="220" x2="540" y2="220" stroke="#f3f4f6" stroke-width="1" />
  
  <text x="40" y="240" font-family="Arial" font-size="12" font-weight="bold" fill="#6b7280">Sentiment Analysis</text>
  <rect x="40" y="250" width="80" height="20" rx="10" fill="#ECFDF5" />
  <text x="50" y="264" font-family="Arial" font-size="10" fill="#10B981">Positive</text>
  <text x="130" y="264" font-family="Arial" font-size="12" fill="#6b7280">Very positive sentiment with themes of accomplishment and motivation.</text>
</svg>