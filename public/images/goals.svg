<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f9fafb" />
      <stop offset="100%" stop-color="#f3f4f6" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="300" fill="url(#bg-gradient)" />
  
  <!-- Header -->
  <rect x="0" y="0" width="600" height="50" fill="white" />
  <text x="20" y="30" font-family="Arial" font-size="18" font-weight="bold" fill="#111827">Goals</text>
  
  <!-- Category filters -->
  <rect x="20" y="70" width="80" height="30" rx="15" fill="#4F46E5" />
  <text x="40" y="90" font-family="Arial" font-size="12" fill="white">All Goals</text>
  
  <rect x="110" y="70" width="80" height="30" rx="15" fill="#EBF5FF" stroke="#3B82F6" stroke-width="1" />
  <text x="130" y="90" font-family="Arial" font-size="12" fill="#3B82F6">Career</text>
  
  <rect x="200" y="70" width="80" height="30" rx="15" fill="#ECFDF5" stroke="#10B981" stroke-width="1" />
  <text x="220" y="90" font-family="Arial" font-size="12" fill="#10B981">Health</text>
  
  <rect x="290" y="70" width="80" height="30" rx="15" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1" />
  <text x="310" y="90" font-family="Arial" font-size="12" fill="#F59E0B">Personal</text>
  
  <!-- Goal Card 1 -->
  <rect x="20" y="120" width="560" height="80" rx="8" fill="white" stroke="#e5e7eb" stroke-width="1" />
  <rect x="20" y="120" width="4" height="80" fill="#3B82F6" rx="2" />
  <text x="40" y="145" font-family="Arial" font-size="16" font-weight="bold" fill="#111827">Complete JavaScript course</text>
  <rect x="300" y="138" width="50" height="20" rx="10" fill="#EBF5FF" />
  <text x="310" y="152" font-family="Arial" font-size="10" fill="#3B82F6">career</text>
  <text x="40" y="165" font-family="Arial" font-size="12" fill="#6b7280">Finish the advanced JavaScript course on Udemy</text>
  <rect x="40" y="180" width="200" height="8" rx="4" fill="#f3f4f6" />
  <rect x="40" y="180" width="150" height="8" rx="4" fill="#3B82F6" />
  <text x="250" y="185" font-family="Arial" font-size="10" fill="#6b7280">75%</text>
  
  <!-- Goal Card 2 -->
  <rect x="20" y="210" width="560" height="80" rx="8" fill="white" stroke="#e5e7eb" stroke-width="1" />
  <rect x="20" y="210" width="4" height="80" fill="#10B981" rx="2" />
  <text x="40" y="235" font-family="Arial" font-size="16" font-weight="bold" fill="#111827">Run 5K</text>
  <rect x="300" y="228" width="50" height="20" rx="10" fill="#ECFDF5" />
  <text x="310" y="242" font-family="Arial" font-size="10" fill="#10B981">health</text>
  <text x="40" y="255" font-family="Arial" font-size="12" fill="#6b7280">Train for and complete a 5K run</text>
  <rect x="40" y="270" width="200" height="8" rx="4" fill="#f3f4f6" />
  <rect x="40" y="270" width="120" height="8" rx="4" fill="#10B981" />
  <text x="250" y="275" font-family="Arial" font-size="10" fill="#6b7280">60%</text>
</svg>